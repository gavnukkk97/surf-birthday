# Surf Birthday Route — статика под nginx
server {
    listen 80;
    server_name surf-birthday.example.com;   # замени на свой домен или IP

    root /var/www/surf-birthday;
    index index.html;

    # статику не кешируем надолго (после правок все сразу видят свежую версию)
    add_header Cache-Control "no-store, must-revalidate";

    location / {
        try_files $uri $uri/ =404;
    }
}
